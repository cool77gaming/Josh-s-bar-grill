  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1c1f26;
      --border: #2c303a;
      --text: #edeef0;
      --muted: #9aa2b1;
      --accent: #5b9bff;
      --hot-bg: #3a1414;
      --warm-bg: #332405;
      --cool-bg: #06282c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    padding: 2rem 1.25rem 1rem;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.25rem; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .stat .n { font-size: 1.6rem; font-weight: 700; }
  .stat .l { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .tab {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .name { font-weight: 700; font-size: 1.02rem; }
  .type { color: var(--muted); font-size: 0.85rem; }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.no_website { background: var(--hot-bg); color: var(--hot); }
  .badge.outdated { background: var(--warm-bg); color: var(--warm); }
  .badge.low_reviews { background: var(--cool-bg); color: var(--cool); }

  .rank {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--hot);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }

  .row {
    font-size: 0.88rem;
  }
  .row b { color: var(--text); }
  .sell-line { color: var(--text); }
  .reason { color: var(--muted); }

  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1.25rem 3rem;
    color: var(--muted);
    font-size: 0.78rem;
  }
  footer a { color: var(--accent); }
</style>
</head>

<script>
  const DATA = JSON.parse(document.getElementById('lead-data').textContent);
  const leads = DATA.leads;

  const TIER_LABEL = {
    no_website: "No Website",
    outdated: "Outdated Site",
    low_reviews: "Low Reviews",
  };

  document.getElementById('subtitle').textContent =
    `${leads.length} leads · compiled ${DATA.generated} · sorted by highest-probability payoff`;

  const counts = { all: leads.length, no_website: 0, outdated: 0, low_reviews: 0 };
  leads.forEach(l => counts[l.tier]++);

  const statsEl = document.getElementById('stats');
  const statDefs = [
    ["Total Leads", counts.all],
    ["No Website", counts.no_website],
    ["Outdated Site", counts.outdated],
    ["Low Reviews", counts.low_reviews],
  ];
  statsEl.innerHTML = statDefs.map(([label, n]) =>
    `<div class="stat"><div class="n">${n}</div><div class="l">${label}</div></div>`
  ).join('');

  const tabsEl = document.getElementById('tabs');
  const tabDefs = [
    ["all", "All"],
    ["no_website", "No Website"],
    ["outdated", "Outdated Site"],
    ["low_reviews", "Low Reviews"],
  ];
  let activeTab = "all";

  function render() {
    tabsEl.innerHTML = tabDefs.map(([key, label]) =>
      `<button class="tab${key === activeTab ? ' active' : ''}" data-tab="${key}">${label}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    const visible = activeTab === "all" ? leads : leads.filter(l => l.tier === activeTab);
    const mainEl = document.getElementById('main');

    mainEl.innerHTML = visible.map((l, i) => {
      const rankTag = i < 3 && activeTab === "all"
        ? `<div class="rank">🔥 #${i + 1} TOP PROSPECT</div>` : "";
      const websiteLine = l.website
        ? `<a href="${l.website}" target="_blank" rel="noopener">${l.website.replace(/^https?:\/\//, '')}</a>`
        : `<span>No website found</span>`;
      const phoneLine = l.phone
        ? `<a href="tel:${l.phone.replace(/[^0-9+]/g, '')}">${l.phone}</a>`
        : `<span>No phone on file</span>`;
      const reviewLine = l.reviewCount > 0
        ? `${l.rating.toFixed(1)}★ (${l.reviewCount} review${l.reviewCount === 1 ? '' : 's'})`
        : `No reviews yet`;

      return `
        <div class="card">
          ${rankTag}
          <div class="card-top">
            <div>
              <div class="name">${l.name}</div>
              <div class="type">${l.type || ''}</div>
            </div>
            <span class="badge ${l.tier}">${TIER_LABEL[l.tier]}</span>
          </div>
          <div class="meta">
            <span>📞 ${phoneLine}</span>
            <span>🌐 ${websiteLine}</span>
            <span>⭐ ${reviewLine}</span>
          </div>
          <div class="row sell-line"><b>Sell them:</b> ${l.sell}</div>
          <div class="row reason"><b>Weak point:</b> ${l.reason}</div>
        </div>
      `;
    }).join('');
  }

  render();
</script>
